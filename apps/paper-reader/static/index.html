<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文伴读 · Paper Companion</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="logo">P</span><div><strong>论文伴读</strong><small>PAPER COMPANION</small></div></div><div id="connection" class="pill">正在检查本机连接</div></header>
<div class="layout"><aside class="library"><p class="eyebrow">YOUR READING DESK</p><h1>从一篇论文开始。</h1><p class="muted">原文留在眼前，让问题带着阅读向前。</p><label class="upload" for="file" id="drop">＋ 拖入或选择 PDF<input id="file" type="file" accept="application/pdf,.pdf" hidden></label><label for="url">或粘贴 arXiv 链接</label><input id="url" type="url" placeholder="https://arxiv.org/abs/…"><button id="import">导入论文</button><button id="demo" class="quiet">试读 QuantMLA ↗</button><p class="eyebrow shelf">我的论文</p><div id="papers"></div><p class="small">论文、阅读位置和笔记保存在本机。点击“请 AI 讲解”才会把当前问题、附近页面和相关历史交给模型。</p></aside>
<main class="reader"><div class="toolbar"><button id="prev" aria-label="上一页">←</button><input id="page" type="number" min="1" value="1" aria-label="物理页"><span id="total">/ —</span><button id="next" aria-label="下一页">→</button><span class="spacer"></span><button id="textMode">选取文字</button><button id="zoomOut" aria-label="缩小">−</button><button id="zoomIn" aria-label="放大">＋</button><a id="original" target="_blank" rel="noopener" hidden>原 PDF</a></div><div id="canvas"><div id="empty"><div class="empty-icon">¶</div><h2>原文与理解，并排发生。</h2><p>添加一篇论文，选择读到的页码，<br>然后在右侧提出第一个问题。</p></div><img id="image" alt="论文原页" hidden><pre id="text" hidden></pre></div><footer id="paperMeta">支持上传 PDF 和导入 arXiv · 物理页码从 1 开始</footer></main>
<aside class="discussion"><div class="discussion-head"><span class="eyebrow">READ · ASK · UNDERSTAND</span><h2>一起读懂这一页</h2><p id="scope" class="muted">选择论文后开始。已有笔记会自动恢复。</p></div><div id="messages" aria-live="polite"></div><section class="composer"><label for="quote">选中的原文 / 公式编号</label><textarea id="quote" rows="2" placeholder="左侧切换文字模式，选中片段后会带到这里"></textarea><label for="question">你想弄懂什么？</label><textarea id="question" rows="3" placeholder="例如：为什么 RoPE 路径的量化误差更敏感？"></textarea><label class="check"><input id="web" type="checkbox" checked> 允许联网查证背景知识</label><div class="actions"><button id="ask" class="primary">请 AI 讲解</button><button id="copy">复制到 GPT</button></div><details><summary>保存手写笔记 / 粘贴 GPT 的回答</summary><textarea id="manual" rows="4" placeholder="笔记会与当前论文和页码绑定"></textarea><button id="save">保存到这一页</button></details><div class="actions"><button id="export" class="quiet">导出全部笔记</button></div><p id="status" role="status"></p></section></aside></div><script src="/app.js"></script></body></html>
