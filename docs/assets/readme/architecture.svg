<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">One main AI, roles on demand</title>
  <desc id="desc">Conceptual workflow: a general-purpose main AI routes authorized work to relevant research, code and kernels, learning, or travel roles. Roles use host tools and produce project artifacts with evidence. Independent acceptance checks evidence; revision returns to the main AI. The host supplies models, tools, credentials and permissions. The workflow repository provides skills, prompts and an optional local runtime, not a deployed scheduler. Current project guides, tasks, advice and results live under PROJECT_ROOT/agent_doc; they are separate from WORKFLOW_ROOT.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#64dfca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="revision-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L8 5L0 9" fill="none" stroke="#b8a5f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="1080" rx="24" fill="#0d192b"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="56" y="66" font-size="36" font-weight="700" fill="#f1f6fd">One main AI. Roles on demand.</text>
    <text x="56" y="104" font-size="22" fill="#9cb3c9">A workflow map — the host provides the execution environment.</text>
    <g id="host-boundary">
      <rect x="56" y="134" width="1088" height="70" rx="14" fill="#17253b" stroke="#41516c" stroke-dasharray="5 5"/>
      <text x="80" y="178" font-size="23" fill="#c9bafd" font-weight="700">EXTERNAL HOST</text>
      <text x="345" y="178" font-size="24" fill="#d7e2ee">Models · tools · credentials · permissions</text>
    </g>
    <g id="main-ai">
      <rect x="316" y="248" width="568" height="105" rx="18" fill="#173840" stroke="#4caaa0" stroke-width="1.5"/>
      <text x="600" y="293" text-anchor="middle" font-size="30" font-weight="700" fill="#effdfa">General-purpose main AI</text>
      <text x="600" y="328" text-anchor="middle" font-size="22" fill="#b3d3d1">Intent · plan · authorized routing</text>
    </g>
    <path id="route-to-roles" d="M600 353V407" fill="none" stroke="#64dfca" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <g id="on-demand-roles">
      <text x="120" y="389" font-size="18" fill="#8ca8bd" letter-spacing="2">ON-DEMAND ROLES</text>
      <rect x="120" y="411" width="960" height="78" rx="16" fill="#15293a" stroke="#355162"/>
      <path d="M360 430V470M600 430V470M840 430V470" stroke="#355162"/>
      <text x="240" y="459" text-anchor="middle" font-size="26" fill="#dcf3ef">Research</text>
      <text x="480" y="459" text-anchor="middle" font-size="25" fill="#dcf3ef">Code &amp; kernels</text>
      <text x="720" y="459" text-anchor="middle" font-size="26" fill="#dcf3ef">Learning</text>
      <text x="960" y="459" text-anchor="middle" font-size="26" fill="#dcf3ef">Travel</text>
    </g>
    <path id="roles-to-work" d="M600 489V541" fill="none" stroke="#64dfca" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <g id="work-and-evidence">
      <rect x="168" y="545" width="864" height="113" rx="18" fill="#142536" stroke="#355162"/>
      <path d="M574 568V635" stroke="#355162"/>
      <text x="203" y="587" font-size="26" fill="#edf4fb" font-weight="700">Use host tools</text>
      <text x="203" y="623" font-size="22" fill="#a8bed1">Search · run · inspect</text>
      <text x="610" y="587" font-size="26" fill="#edf4fb" font-weight="700">Produce artifacts</text>
      <text x="610" y="623" font-size="22" fill="#a8bed1">Code · figures · papers · plans</text>
    </g>
    <path id="evidence-to-review" d="M600 658V710" fill="none" stroke="#64dfca" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <text x="620" y="693" font-size="20" fill="#8faebf">artifacts + evidence</text>
    <g id="independent-acceptance">
      <rect x="316" y="716" width="568" height="109" rx="18" fill="#282b46" stroke="#8a7db9" stroke-width="1.5"/>
      <text x="600" y="759" text-anchor="middle" font-size="29" font-weight="700" fill="#f0eaff">Independent acceptance</text>
      <text x="600" y="795" text-anchor="middle" font-size="22" fill="#c6bfde">Check evidence · accept within scope</text>
    </g>
    <path id="revision-loop" d="M316 770H78V301H316" fill="none" stroke="#b8a5f6" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#revision-arrow)"/>
    <rect x="57" y="663" width="44" height="94" rx="10" fill="#0d192b"/>
    <text transform="translate(85 744) rotate(-90)" font-size="20" fill="#c1aff7">revise</text>
    <g id="source-and-project-boundaries">
      <path d="M56 870H1144" stroke="#304156"/>
      <text x="56" y="908" font-size="18" fill="#87a0b8" letter-spacing="2">TWO ROOTS, DIFFERENT RESPONSIBILITIES</text>
      <text x="56" y="948" font-size="24" font-weight="700" fill="#9ce7d8">WORKFLOW_ROOT</text>
      <text x="56" y="981" font-size="22" fill="#bdcddd">Skills · prompts · optional local runtime</text>
      <text x="56" y="1013" font-size="21" fill="#8fa8be">No scheduler is deployed by installation.</text>
      <path d="M595 931V1030" stroke="#304156"/>
      <text x="638" y="948" font-size="24" font-weight="700" fill="#c9b8ff">PROJECT_ROOT / agent_doc/</text>
      <text x="638" y="981" font-size="22" fill="#bdcddd">Human guides · tasks · advice · results</text>
      <text x="638" y="1013" font-size="21" fill="#8fa8be">Current project context and evidence.</text>
    </g>
  </g>
</svg>
