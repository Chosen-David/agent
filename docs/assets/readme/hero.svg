<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workflows</title>
  <desc id="desc">From intent to verified artifacts. An abstract workflow branches from a main node into specialist paths, rejoins at an artifact, and reaches a verification checkpoint. Decorative schematic, not performance data.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1528"/><stop offset="1" stop-color="#14263b"/>
    </linearGradient>
    <linearGradient id="path" gradientUnits="userSpaceOnUse" x1="742" y1="182" x2="1063" y2="182">
      <stop stop-color="#57dfc5"/><stop offset="1" stop-color="#b4a1fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#backdrop)"/>
  <g fill="none" stroke="#21384c" stroke-width="1" opacity=".55">
    <path d="M660 0V360M740 0V360M820 0V360M900 0V360M980 0V360M1060 0V360M1140 0V360"/>
    <path d="M620 60H1200M620 140H1200M620 220H1200M620 300H1200"/>
  </g>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <rect x="58" y="57" width="34" height="5" rx="2.5" fill="#59dfc5"/>
    <text x="58" y="106" fill="#8faabd" font-size="18" letter-spacing="3">PURPOSE · ROLES · EVIDENCE</text>
    <text x="54" y="181" fill="#f1f6fd" font-size="62" font-weight="700" letter-spacing="-2">Agent Workflows</text>
    <text x="58" y="227" fill="#b6c7d8" font-size="26">From intent to verified artifacts.</text>
    <text x="58" y="299" fill="#72d6c4" font-size="17" letter-spacing="1.5">RESEARCH / CODE / LEARNING / TRAVEL</text>
  </g>
  <g id="specialist-paths" fill="none" stroke="url(#path)" stroke-width="2.5">
    <path d="M742 182C780 182 774 100 826 100H854C904 100 894 182 935 182"/>
    <path d="M742 182H935"/>
    <path d="M742 182C780 182 774 264 826 264H854C904 264 894 182 935 182"/>
    <path d="M979 182H1063"/>
  </g>
  <g id="main-node">
    <circle cx="720" cy="182" r="47" fill="#142f3e" stroke="#2b605f"/>
    <circle cx="720" cy="182" r="27" fill="#183e47" stroke="#59dfc5" stroke-width="2"/>
    <path d="M709 182H731M720 171V193" stroke="#86efda" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="role-nodes" fill="#152b3c" stroke="#73dcca" stroke-width="2">
    <circle cx="840" cy="100" r="14"/><circle cx="840" cy="182" r="14"/><circle cx="840" cy="264" r="14"/>
  </g>
  <g id="artifact-node">
    <rect x="935" y="156" width="44" height="52" rx="9" fill="#273249" stroke="#b4a1fa" stroke-width="2"/>
    <path d="M947 171H967M947 181H967M947 191H960" stroke="#d1c6fc" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="verification-node">
    <circle cx="1089" cy="182" r="37" fill="#252b47" stroke="#71658f"/>
    <circle cx="1089" cy="182" r="25" fill="#323951" stroke="#c1afff" stroke-width="2"/>
    <path d="M1078 182L1086 190L1101 174" fill="none" stroke="#ded4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
