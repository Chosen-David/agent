# Agent runtime tmux configuration
# Enables mouse scroll, pane resize, and vi-style copy-paste.
# Loaded automatically by task_supervisor via `tmux -f`.

# --- Mouse support ---
# Enables scroll, pane click/resize, and window selection.
set -g mouse on

# --- Copy mode (vi-style) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Scrollback buffer ---
set -g history-limit 50000

# --- Clipboard integration (Linux xclip/xsel) ---
# Copy to system clipboard if available. No-op on systems without it.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || true'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || true'

# --- Visual ---
# Let the outer terminal follow the attached session rather than the shell process.
set -g set-titles on
set -g set-titles-string '#{session_name}'
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g pane-border-format " #P: #{pane_title} "
