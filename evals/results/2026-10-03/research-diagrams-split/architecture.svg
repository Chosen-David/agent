<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="95mm" viewBox="0 0 1080 570" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Two-path logit combination</title>
<desc id="figure-desc">Proposed schematic, synthetic specification, not implemented. Parallel paths A and B merge into z = a + b, then p = softmax(z). Fixed values V enter only the output y = p^T V.</desc>
<defs><marker id="data-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4B5B6A"/></marker></defs>
<rect width="1080" height="570" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#203244">
<text x="55" y="58" font-size="29" font-weight="600">Two-path logit combination</text>
<text x="55" y="95" font-size="20" fill="#5B6875">PROPOSED SCHEMATIC · Synthetic specification · Not implemented</text>
<text x="55" y="150" font-size="19" fill="#5B6875">Parallel paths</text>
<path id="edge-a-sum" data-source="a" data-target="sum" data-kind="data_flow" d="M 270 210 H 310 V 265 H 355" fill="none" stroke="#4B5B6A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
<path id="edge-b-sum" data-source="b" data-target="sum" data-kind="data_flow" d="M 270 350 H 310 V 295 H 355" fill="none" stroke="#4B5B6A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
<path id="edge-sum-softmax" data-source="sum" data-target="softmax" data-kind="data_flow" d="M 525 280 H 565" fill="none" stroke="#4B5B6A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
<path id="edge-softmax-output" data-source="softmax" data-target="output" data-kind="data_flow" d="M 785 280 H 825" fill="none" stroke="#4B5B6A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
<path id="edge-v-output" data-source="v" data-target="output" data-kind="data_flow" d="M 925 405 V 315" fill="none" stroke="#4B5B6A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
<g id="node-a" data-node-id="a"><rect x="55" y="175" width="215" height="70" rx="10" fill="#E8F1FA" stroke="#2A6597" stroke-width="1.8"/><text x="162.5" y="218.0" text-anchor="middle" font-size="24">Path A logits a</text></g>
<g id="node-b" data-node-id="b"><rect x="55" y="315" width="215" height="70" rx="10" fill="#E8F1FA" stroke="#2A6597" stroke-width="1.8"/><text x="162.5" y="358.0" text-anchor="middle" font-size="24">Path B logits b</text></g>
<g id="node-sum" data-node-id="sum"><rect x="355" y="245" width="170" height="70" rx="10" fill="#ECF5F2" stroke="#397762" stroke-width="1.8"/><text x="440.0" y="288.0" text-anchor="middle" font-size="24">z = a + b</text></g>
<g id="node-softmax" data-node-id="softmax"><rect x="565" y="245" width="220" height="70" rx="10" fill="#ECF5F2" stroke="#397762" stroke-width="1.8"/><text x="675.0" y="288.0" text-anchor="middle" font-size="24">p = softmax(z)</text></g>
<g id="node-v" data-node-id="v"><rect x="825" y="405" width="200" height="70" rx="10" fill="#F5F0E8" stroke="#8B6E42" stroke-width="1.8"/><text x="925.0" y="448.0" text-anchor="middle" font-size="24">Fixed values V</text></g>
<g id="node-output" data-node-id="output"><rect x="825" y="245" width="200" height="70" rx="10" fill="#EAF0FA" stroke="#365D8D" stroke-width="1.8"/><text x="925.0" y="288.0" text-anchor="middle" font-size="24">y = p^T V</text></g>
<text x="949" y="367" font-size="18" fill="#6E5B3D">Bypass</text>
<path d="M 55 524 H 106" fill="none" stroke="#4B5B6A" stroke-width="2.4" marker-end="url(#data-arrow)"/>
<text x="119" y="531" font-size="19" fill="#5B6875">Data flow</text>
<text x="1025" y="531" text-anchor="end" font-size="19" fill="#5B6875">No measured performance specified</text>
</g></svg>