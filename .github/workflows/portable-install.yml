name: Portable installation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Pinned official v6 revisions; no credential persistence or result uploads.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        env:
          # Windows Git otherwise checks tracked reference aliases out as text.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -p test_serial_recovery.py -v
      - if: runner.os == 'Linux'
        env:
          AGENT_REQUIRE_NATIVE_PROC: '1'
        run: python -B -m unittest tests.test_managed_supervisor.ProcessIdentityTests tests.test_managed_supervisor.WorkerTests tests.test_worker_cancellation tests.test_worker_final_report tests.test_supervisor_terminal_receipt -v
      - run: python -B -m unittest discover -s tests -p test_completed_review_recovery.py -v
      - run: python -B -m unittest discover -s tests -p test_terminal_revalidation.py -v
      - run: python -B -m unittest tests.test_task_runtime.RuntimeContracts.test_bounded_real_subprocess_serve_arm_artifact_convergence -v
        if: runner.os == 'Linux'
      - run: python -B -m unittest discover -s tests -p test_setup_portable.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_limits.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_publication.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_manifest.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_legacy_text.py -v
      - run: python -B -m unittest discover -s tests -p test_codex_instruction_read.py -v
      - run: python -B -m unittest discover -s tests -p test_uninstall_text.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_text.py -v
      - run: python -B -m unittest discover -s tests -p test_role_process.py -v
      - run: python -B -m unittest discover -s tests -p test_install_profiles.py -v
      - run: python -B -m unittest discover -s tests -p test_memory_output.py -v
      - run: python -B -m unittest discover -s tests -p test_memory_sibling_counts.py -v
      - run: python -B -m unittest discover -s tests -p test_documents.py -v
      - run: python -B -m unittest discover -s tests -p test_context_cli_output.py -v
      - run: python -B -m unittest discover -s tests -p test_task_context.py -v
      - run: python -B -m unittest discover -s tests -p test_task_fence.py -v
      - run: python -B -m unittest discover -s tests -p test_migrate_fence.py -v
      - run: python -B -m unittest discover -s tests -p test_advice_context.py -v
      - run: python -B -m unittest discover -s tests -p test_advice_fence.py -v
      - run: python -B -m unittest discover -s tests -p test_prompt_context.py -v
      - run: python -B -m unittest discover -s tests -p test_usage_shapes.py -v
      - run: python -B -m unittest discover -s tests -p test_intake.py -v
      - run: python -B -m unittest discover -s tests -p test_inventory_scan_errors.py -v
      - run: python -B -m unittest discover -s tests -p test_context_cli_wire.py -v
      - run: python -B -m unittest discover -s tests -p test_result_output.py -v
      - run: python -B -m unittest discover -s tests -p test_validation_context.py -v
      - run: python -B -m unittest discover -s tests -p test_communication_output.py -v
      - run: python -B -m unittest discover -s tests -p test_mailbox_sequence.py -v
      - run: python -B -m unittest discover -s tests -p test_role_definition.py -v
      - run: python -B -m unittest discover -s tests -p test_single_main.py -v
      - run: python -B -m unittest discover -s tests -p test_single_main_plan.py -v
      - run: python -B -m unittest discover -s tests -p test_completion_basis_freshness.py -v
      - run: python -B -m unittest discover -s tests -p test_completion_proof_bindings.py -v
      - run: python -B -m unittest discover -s tests -p test_result_dispatch_freshness.py -v
      - run: python -B -m unittest discover -s tests -p test_local_path_guards.py -v
      - run: python -B -m unittest discover -s tests -p 'test_knowledge_ingest*.py' -v
      - run: python -B -m unittest discover -s tests -p test_markdown_section_context_regressions.py -v
      - run: python -B -m unittest discover -s tests -p test_advice_poll.py -v
      - run: python -B -m unittest discover -s tests -p test_knowledge_read_boundary.py -v
      - run: python -B -m unittest discover -s tests -p test_knowledge_index.py -v
      - run: python -B -m unittest discover -s tests -p test_engine_pre_action_claim.py -v
      - run: python -B -m unittest discover -s tests -p test_managed_child_authority.py -v
      - run: python -B -m unittest discover -s tests -p test_checkpoint_json_fd.py -v
      - run: python -B scripts/sync_plugin_references.py --check

  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest tests.test_markdown_links tests.test_code_reading tests.test_visual_explanation tests.test_figure_contract tests.test_agent_eval_pipeline tests.test_codex_source_aliases tests.test_development_eval_boundary tests.test_fixture_imports -v
      - run: python -B -m unittest tests.test_claim_graph_residual tests.test_handoff_basis tests.test_communication tests.test_memory_context_closure -v

  ingest-macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p test_serial_recovery.py -v
      - run: python -B -m unittest discover -s tests -p test_completed_review_recovery.py -v
      - run: python -B -m unittest discover -s tests -p test_terminal_revalidation.py -v
      - run: python -B -m unittest tests.test_task_runtime.RuntimeContracts.test_bounded_real_subprocess_serve_arm_artifact_convergence -v
      - run: python -B -m unittest discover -s tests -p test_usage_shapes.py -v
      - run: python -B -m unittest discover -s tests -p test_intake.py -v
      - run: python -B -m unittest discover -s tests -p test_mailbox_sequence.py -v
      - run: python -B -m unittest discover -s tests -p test_role_definition.py -v
      - run: python -B -m unittest discover -s tests -p test_single_main.py -v
      - run: python -B -m unittest discover -s tests -p test_single_main_plan.py -v
      - run: python -B -m unittest discover -s tests -p test_completion_basis_freshness.py -v
      - run: python -B -m unittest discover -s tests -p test_completion_proof_bindings.py -v
      - run: python -B -m unittest discover -s tests -p test_inventory_scan_errors.py -v
      - run: python -B -m unittest discover -s tests -p test_setup_publication.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_setup_manifest.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_setup_legacy_text.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_codex_instruction_read.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_uninstall_text.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_setup_text.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p 'test_knowledge_ingest*.py' -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_markdown_section_context_regressions.py -v
      - run: python -B -m unittest discover -s tests -p test_advice_poll.py -v
      - run: python -B -m unittest discover -s tests -p test_knowledge_read_boundary.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_knowledge_index.py -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s tests -p test_engine_pre_action_claim.py -v
      - run: python -B -m unittest discover -s tests -p test_managed_child_authority.py -v
      - run: python -B -m unittest discover -s tests -p test_checkpoint_json_fd.py -v
      - run: python -B scripts/sync_plugin_references.py --check
