name: Central project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated tool environment
        run: python -m venv .venv
      - name: Run external checks against this checkout
        env:
          AGENT_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .venv/bin/python -B scripts/project_test.py
          --workflow-root "$GITHUB_WORKSPACE" --project agent
          --target "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/agent-project-checks"
      - name: Preserve checks and original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-project-checks
          path: ${{ runner.temp }}/agent-project-checks
          if-no-files-found: warn
